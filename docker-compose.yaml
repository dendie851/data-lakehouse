version: '3.8'

services:
  # --- OLTP Database (PostgreSQL) ---
  postgres:
    image: postgres:15
    container_name: postgres_oltp
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: ecommerce_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # --- Object Storage (MinIO) ---
  minio:
    image: minio/minio
    container_name: minio_storage
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # Create bucket automatically
  mc:
    image: minio/mc
    container_name: minio_client
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 admin password123) do echo '...waiting for MinIO...' && sleep 1; done;
      /usr/bin/mc mb myminio/warehouse;
      /usr/bin/mc policy set public myminio/warehouse;
      exit 0;
      "

  # --- Spark (ETL Process) ---
  spark-master:
    image: bitnamilegacy/spark:3.4.1
    container_name: spark_master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./src:/opt/bitnami/spark/src
      - ./config/spark/spark-defaults.conf:/opt/bitnami/spark/conf/spark-defaults.conf

  spark-worker:
    image: bitnamilegacy/spark:3.4.1
    container_name: spark_worker
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_CORES=1
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no

  # --- Trino (Query Engine) ---
  trino:
    image: trinodb/trino:422
    container_name: trino_engine
    ports:
      - "8081:8080"
      - "8443:8443"
    volumes:
      - ./config/trino/catalog:/etc/trino/catalog
      - ./config/trino/config.properties:/etc/trino/config.properties
      - ./config/trino/trino-keystore.jks:/etc/trino/trino-keystore.jks

  # --- Metabase (Visualization) ---
  metabase:
    image: metabase/metabase
    container_name: metabase_viz
    ports:
      - "13000:3000"
    depends_on:
      - trino
    volumes:
      - metabase_data:/metabase-data

volumes:
  postgres_data:
  minio_data:
  metabase_data:
